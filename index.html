<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bataille corse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>

    <div id="mode-picker">
<label for="difficulty">Mode</label>
<select id="difficulty"></select>
</div>

<section class="side">
<h2 id="bot-name">Theotime</h2>
<div class="deck"><span class="deck-count" id="computer-count">26</span></div>
</section>

<section id="table">
<div id="pile-area">
<div id="pile-count">
<span id="pile-number">0</span>
<small>au tas</small>
</div>
<div id="pile"></div>
</div>
<p id="challenge-info"></p>
<p id="message">Pose ta carte pour commencer.</p>
</section>

<section class="side player-side">
<div class="player-deck">
<h2>Toi</h2>
<button id="play-btn" class="deck" aria-label="Poser une carte">
<span class="deck-count" id="player-count">26</span>
</button>
<small class="deck-hint">Clique pour poser (Entrée)</small>
</div>
</section>

<p id="slap-hint">Pour taper sur le tas : barre espace</p>

<button id="restart-btn" hidden>Rejouer</button>
</main>
<div id="toast"></div>
<script type="module" src="game.js"></script>
</body>
</html>
